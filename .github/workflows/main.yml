name: Generate README using shared template

on:
  workflow_dispatch:  # or `push`, or `create`
  create:             # optional: triggers on repo creation
  push:
    branches:
      - main

jobs:
  generate-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Download template and script from shared repo
        run: |
          curl -O https://raw.githubusercontent.com/3dss/AutoReadme/main/readme_template.j2
          curl -O https://raw.githubusercontent.com/3dss/AutoReadme/main/generate_readme.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install jinja2

      - name: Generate README
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_DESCRIPTION: ${{ github.event.repository.description }}
          REPO_OWNER: ${{ github.event.repository.owner.login }}
          REPO_CREATED_AT: ${{ github.event.repository.created_at }}
        run: |
          python AutoReadme/generate_readme.py
          python generate_readme.py

      - name: Commit and push README.md
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Auto-generate README.md from shared template' || echo "No changes"
          git push
